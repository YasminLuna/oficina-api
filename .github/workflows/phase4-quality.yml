name: API Phase 4 - quality and image
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/fase4-microservices]
  push:
    branches: [feature/fase4-microservices]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      SQS_ENDPOINT_URL: http://localhost:4566
      AWS_EC2_METADATA_DISABLED: "true"
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Critical lint
        run: ruff check --select E4,E7,E9,F app tests
      - name: Tests with 80% coverage gate
        run: python -m pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: coverage.xml
          if-no-files-found: ignore
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image without publishing
        run: docker build -t oficina-api:ci .
