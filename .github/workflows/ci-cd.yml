name: CI/CD - Oficina API

on:
  workflow_dispatch:
  pull_request:
    branches: [main, hml]
  push:
    branches: [hml, main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests and coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: test-secret
        run: pytest --cov=app --cov-report=term-missing

      - name: Docker build
        run: docker build -t oficina-api:${{ github.sha }} .

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENABLE_DEPLOY == 'true'
    needs: test-build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve environment
        shell: bash
        run: |
          ENV_NAME="${{ github.ref_name == 'main' && 'prod' || 'hml' }}"
          echo "ENV_NAME=$ENV_NAME" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER_NAME=oficina-$ENV_NAME" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=oficina-api-$ENV_NAME" >> "$GITHUB_ENV"

      - name: Ensure ECR repository
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true >/dev/null

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Load application secrets from AWS Secrets Manager
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_SECRET=$(aws secretsmanager get-secret-value --secret-id "oficina/${ENV_NAME}/database" --query SecretString --output text)
          DATABASE_URL=$(echo "$DATABASE_SECRET" | jq -r '.sqlalchemy_url')
          JWT_SECRET=$(aws secretsmanager get-secret-value --secret-id "oficina/${ENV_NAME}/jwt" --query SecretString --output text)
          kubectl create namespace oficina --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n oficina create secret generic oficina-api-secrets \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy API
        shell: bash
        run: |
          set -uo pipefail
          kubectl apply -k k8s/
          kubectl -n oficina set image deployment/oficina-api api="$IMAGE"

          if ! kubectl -n oficina rollout status deployment/oficina-api --timeout=180s; then
            echo "::error::Deployment rollout failed. Collecting diagnostics..."
            echo "===== DEPLOYMENT ====="
            kubectl -n oficina describe deployment oficina-api || true
            echo "===== PODS ====="
            kubectl -n oficina get pods -o wide || true
            echo "===== POD DESCRIBE ====="
            kubectl -n oficina describe pods -l app=oficina-api || true
            echo "===== CURRENT LOGS ====="
            kubectl -n oficina logs -l app=oficina-api --all-containers=true --tail=200 --prefix=true || true
            echo "===== PREVIOUS LOGS ====="
            for pod in $(kubectl -n oficina get pods -l app=oficina-api -o name 2>/dev/null); do
              kubectl -n oficina logs "$pod" --all-containers=true --previous --tail=200 --prefix=true 2>/dev/null || true
            done
            echo "===== EVENTS ====="
            kubectl -n oficina get events --sort-by='.lastTimestamp' | tail -100 || true
            exit 1
          fi

          kubectl -n oficina get pods -o wide
          kubectl -n oficina get hpa

      - name: Wait for public endpoint
        shell: bash
        run: |
          set -euo pipefail
          HOST=""
          for i in $(seq 1 40); do
            HOST=$(kubectl -n oficina get service oficina-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$HOST" ]; then
              HOST=$(kubectl -n oficina get service oficina-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$HOST" ]; then
              break
            fi
            echo "Aguardando Load Balancer... tentativa $i/40"
            sleep 15
          done
          if [ -z "$HOST" ]; then
            echo "Load Balancer não recebeu endereço dentro do tempo esperado" >&2
            exit 1
          fi
          echo "API_HOST=$HOST" >> "$GITHUB_ENV"
          echo "BACKEND_BASE_URL=http://$HOST" >> "$GITHUB_ENV"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "http://$API_HOST/health"; then
              exit 0
            fi
            echo "Aguardando healthcheck... tentativa $i/20"
            sleep 10
          done
          echo "Healthcheck failed; collecting service diagnostics"
          kubectl -n oficina get service oficina-api -o wide || true
          kubectl -n oficina get endpoints oficina-api -o wide || true
          kubectl -n oficina get pods -o wide || true
          exit 1

      - name: Publish deployment endpoint
        run: |
          echo "## Oficina API" >> "$GITHUB_STEP_SUMMARY"
          echo "BACKEND_BASE_URL=$BACKEND_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "SWAGGER_URL=$BACKEND_BASE_URL/docs" >> "$GITHUB_STEP_SUMMARY"
          echo "HEALTH_URL=$BACKEND_BASE_URL/health" >> "$GITHUB_STEP_SUMMARY"
