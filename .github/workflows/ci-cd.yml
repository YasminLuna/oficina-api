name: CI/CD - Oficina API

on:
  pull_request:
    branches: [main, hml]
  push:
    branches: [hml, main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests and coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: test-secret
        run: pytest --cov=app --cov-report=term-missing
      - name: Docker build
        run: docker build -t oficina-api:${{ github.sha }} .

  deploy:
    if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true' && vars.ECR_REPOSITORY != '' && vars.EKS_CLUSTER_NAME != ''
    needs: test-build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION || 'us-east-1' }}"
      - name: Deploy API
        run: |
          kubectl apply -k k8s/
          kubectl -n oficina set image deployment/oficina-api oficina-api="$IMAGE"
          kubectl -n oficina rollout status deployment/oficina-api --timeout=180s
